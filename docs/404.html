<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — kindclip</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/kindclip/icon.png" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16161f" />

    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("kindclip-site-theme");
        } catch (e) {
          // Storage unavailable: keep the dark default.
        }
        var theme = stored === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#16161f" : "#f5f7fc");
        }
      })();
    </script>

    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("/kindclip/fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "JetBrains Mono Variable";
        src: url("/kindclip/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: dark;

        --font-sans: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace,
          SFMono-Regular, Menlo, Consolas, monospace;

        --page: #16161f;
        --surface: #1c1d29;
        --inset: #101119;
        --hover: #262838;
        --line: #2f3245;
        --line-strong: #3d4158;
        --heading: #e6e9f5;
        --fg: #c8d0e8;
        --muted: #9aa3bd;
        --subtle: #7e87a3;
        --accent: #7aa2f7;
        --accent-text: #9ab8ff;
        --accent-contrast: #12131b;
        --ring: #7aa2f7;
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --page: #f5f7fc;
        --surface: #ffffff;
        --inset: #e9edf6;
        --hover: #e3e8f3;
        --line: #d8deea;
        --line-strong: #b9c2d5;
        --heading: #141827;
        --fg: #2a3045;
        --muted: #5d657b;
        --subtle: #6f778c;
        --accent: #3b63c9;
        --accent-text: #2f55b8;
        --accent-contrast: #ffffff;
        --ring: #3b63c9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 32px 24px;
        background: var(--page);
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent);
        color: var(--accent-contrast);
      }

      main {
        width: min(500px, 100%);
        text-align: center;
      }

      img {
        display: block;
        width: 44px;
        height: 44px;
        margin: 0 auto;
        border-radius: 11px;
        box-shadow: 0 0 0 1px var(--line-strong);
      }

      .code {
        margin: 26px 0 0;
        color: var(--accent-text);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
      }

      h1 {
        margin: 10px 0 0;
        color: var(--heading);
        font-size: clamp(2rem, 6vw, 2.8rem);
        font-weight: 640;
        line-height: 1.02;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      p {
        max-width: 42ch;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 28px;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 42px;
        padding: 0 17px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--fg);
        font-size: 13.5px;
        font-weight: 620;
        text-decoration: none;
        transition: background-color 150ms ease, border-color 150ms ease,
          color 150ms ease;
      }

      a.btn:hover {
        background: var(--hover);
      }

      a.btn.primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-contrast);
      }

      a.btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--fg));
      }

      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
        border-radius: 4px;
      }

      footer {
        margin-top: 38px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--subtle);
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.6;
      }

      code {
        font-family: var(--font-mono);
        font-size: 0.92em;
        background: var(--inset);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <img src="/kindclip/icon.png" alt="" width="44" height="44" />
      <p class="code">404</p>
      <h1>This page doesn't exist.</h1>
      <p>
        The link may be old, or the address may have a typo. Everything about
        kindclip lives on the front page.
      </p>
      <div class="actions">
        <a class="btn primary" href="/kindclip/">Back to kindclip</a>
        <a class="btn" href="/kindclip/#install">Download</a>
      </div>
      <footer>
        A desktop viewer for <code>My Clippings.txt</code>.
      </footer>
    </main>
  </body>
</html>
