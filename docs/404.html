<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — kindclip</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/kindclip/icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1f26" />
    <style>
      :root {
        color-scheme: light;
        --page: #ffffff;
        --fg: #171717;
        --heading: #171717;
        --muted: #5f5f5f;
        --subtle: #737373;
        --line: #e5e5e5;
        --accent-text: #92400e;
        --inverse: #171717;
        --inverse-fg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #1c1f26;
          --fg: #abb2bf;
          --heading: #eef0f4;
          --muted: #9ba3ae;
          --subtle: #8a93a0;
          --line: #3e4451;
          --accent-text: #86c2f3;
          --inverse: #eef0f4;
          --inverse-fg: #1c1f26;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        background: var(--page);
        color: var(--fg);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 460px;
        text-align: center;
      }

      img {
        width: 44px;
        height: 44px;
        border-radius: 11px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          monospace;
        font-size: 0.875em;
        color: var(--accent-text);
      }

      h1 {
        margin: 22px 0 0;
        font-size: 1.5rem;
        font-weight: 620;
        letter-spacing: -0.02em;
        color: var(--heading);
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 28px;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--fg);
        font-size: 14px;
        font-weight: 550;
        text-decoration: none;
      }

      a.btn.primary {
        border-color: transparent;
        background: var(--inverse);
        color: var(--inverse-fg);
      }

      footer {
        margin-top: 36px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--subtle);
        font-size: 12.5px;
      }
    </style>
  </head>

  <body>
    <main>
      <img src="/kindclip/icon.png" alt="" width="44" height="44" />
      <h1>This page doesn't exist</h1>
      <p>
        The link may be old, or the address may have a typo. Everything about
        kindclip lives on the front page.
      </p>
      <div class="actions">
        <a class="btn primary" href="/kindclip/">Back to kindclip</a>
        <a class="btn" href="/kindclip/#install">Download</a>
      </div>
      <footer>
        A desktop viewer for <code>My Clippings.txt</code>.
      </footer>
    </main>
  </body>
</html>
