<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kindclip</title>
    <script>
      // Apply the persisted theme before first paint (no FOUC).
      try {
        var mode = localStorage.getItem("kindclip-theme");
        var dark =
          mode === "dark" ||
          (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var palettes = ["atom-one-dark", "darcula", "nord", "solarized-dark"];
        var storedPalette = localStorage.getItem("kindclip-dark-palette");
        var palette =
          palettes.indexOf(storedPalette) >= 0 ? storedPalette : "atom-one-dark";
        document.documentElement.dataset.mode = dark ? "dark" : "light";
        document.documentElement.dataset.palette = dark ? palette : "light";
        var fontScale = localStorage.getItem("kindclip-font-scale");
        if (fontScale === "small") document.documentElement.style.fontSize = "87.5%";
        else if (fontScale === "large") document.documentElement.style.fontSize = "112.5%";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
