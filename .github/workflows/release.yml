name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Universal: Apple Silicon + Intel
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS build compiles BOTH Apple targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        # A tag run cannot read caches from OTHER tags, but it CAN read the
        # default-branch cache that .github/workflows/ci.yml keeps warm — so
        # `shared-key` must match ci.yml. Restore only: a tag-scoped save could
        # never be reused by the next release, it would only churn cache storage.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: tauri-release
          save-if: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Sync version from tag
        # bash on ALL OSes: pwsh (the windows-latest default) cannot run
        # `${GITHUB_REF_NAME#v}` and has no /tmp — this exact mismatch
        # killed the v0.1.1 release job.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json && mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          # Keep the Rust packages in sync too (drift caused v0.1.0 locals vs v0.1.2 tags).
          sed -i.bak -E 's/^version = ".*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml crates/clippings-parser/Cargo.toml && rm -f src-tauri/Cargo.toml.bak crates/clippings-parser/Cargo.toml.bak

      - run: npm ci

      # The Tauri generate_context! macro validates frontendDist at COMPILE time,
      # so dist/ must exist before ANY cargo build/test — including this one.
      - run: npm run build

      - run: npm run check

      - run: npm run test

      - run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'kindclip ${{ github.ref_name }}'
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
