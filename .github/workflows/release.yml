name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3). Leave empty to auto-bump from commits since the last tag. The version files must already be committed at that version.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by an existing v* tag: use it as-is.
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Resolved version from tag: $VERSION"
            exit 0
          fi

          # workflow_dispatch
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Resolved version from input: $VERSION"
            exit 0
          fi

          # Auto-bump from conventional commits since the last tag.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            LAST_VER="0.0.0"
          else
            RANGE="${LAST_TAG}..HEAD"
            LAST_VER="${LAST_TAG#v}"
          fi

          COMMITS=$(git log "$RANGE" --format=%s 2>/dev/null || true)
          BUMP="none"

          # Breaking change -> major
          if git log "$RANGE" --format=%B 2>/dev/null | grep -q "BREAKING CHANGE"; then
            BUMP="major"
          fi
          if [ "$BUMP" = "none" ] && echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            BUMP="major"
          fi

          # feat -> minor
          if [ "$BUMP" = "none" ] && echo "$COMMITS" | grep -qE '^(feat|feature)(\(.+\))?:'; then
            BUMP="minor"
          fi

          # fix/perf/refactor -> patch
          if [ "$BUMP" = "none" ] && echo "$COMMITS" | grep -qE '^(fix|perf|refactor)(\(.+\))?:'; then
            BUMP="patch"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits (feat/fix/perf/refactor/breaking) since ${LAST_TAG:-the beginning}. Nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r MA MI PA <<< "$LAST_VER"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          VERSION="$MA.$MI.$PA"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Pick a version manually."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Auto-bumped ($BUMP) to $VERSION from ${LAST_TAG:-initial}"

      - name: Verify the commit is releasable
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # workflow_dispatch can run from any branch, and a tag can be pushed on
          # an unmerged commit. Either would publish bytes that never reached main.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release from a merged commit."
            exit 1
          fi

          # Every version file is bumped by a commit before the release runs; the
          # runner only rewrites them for the build. This drift once shipped
          # v0.1.0 locals against a v0.1.2 tag, so the tag must agree with its
          # own sources before anything is built.
          expect_version() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 says $2 but the release resolves $VERSION. Commit the bump, or dispatch with an explicit version that matches it."
              exit 1
            fi
          }

          expect_version package.json "$(jq -r .version package.json)"

          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAURI_VERSION" != "null" ]; then
            expect_version src-tauri/tauri.conf.json "$TAURI_VERSION"
          fi

          expect_version src-tauri/Cargo.toml \
            "$(awk '/^version = "/{sub(/^version = "/,""); sub(/"$/,""); print; exit}' src-tauri/Cargo.toml)"
          expect_version crates/clippings-parser/Cargo.toml \
            "$(awk '/^version = "/{sub(/^version = "/,""); sub(/"$/,""); print; exit}' crates/clippings-parser/Cargo.toml)"

  create-release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes come from CHANGELOG.md at the commit being released, not
          # at the branch tip.
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Create or reuse the GitHub release
        # Every matrix leg uploads in parallel. Creating the release once here
        # and handing the legs its id keeps tauri-action from racing itself:
        # v1.9.0 ended up duplicated because two legs each created a release
        # for the same tag before seeing each other's.
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh and the notes script both need the repository explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
          TITLE: kindclip v${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Release notes are the CHANGELOG section for this version, not
            # the generated PR list: the changelog leaves out refactors and
            # tooling on purpose. The flags are picked first so the release is
            # created at one call site (see ci-workflows.test.ts).
            NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            NOTES_ARGS=(--generate-notes)
            set +e
            bash .github/scripts/release-notes.sh "$VERSION" "$GH_REPO" >"$NOTES_FILE"
            NOTES_STATUS=$?
            set -e
            case "$NOTES_STATUS" in
              0) NOTES_ARGS=(--notes-file "$NOTES_FILE") ;;
              1)
                echo "::warning::CHANGELOG.md has no section for $VERSION; falling back to --generate-notes."
                ;;
              *)
                echo "::error::release-notes.sh failed with status $NOTES_STATUS"
                exit "$NOTES_STATUS"
                ;;
            esac
            gh release create "$TAG" \
              --title "$TITLE" \
              "${NOTES_ARGS[@]}" \
              --target "$GITHUB_SHA"
          fi
          # A re-release reuses the tag but replaces every bundle, so the
          # manifest from the previous attempt carries signatures over files
          # that no longer exist. tauri-action merges into the manifest it
          # finds and keeps a platform entry it cannot re-resolve, which left
          # the 2.1.0 macOS signature pointing at the old bundle and broke
          # that update outright. Start from a clean file instead.
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'latest.json'; then
            echo "Dropping the stale latest.json from a previous attempt"
            gh release delete-asset "$TAG" latest.json --yes
          fi
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          if [ -z "$release_id" ]; then
            echo "Could not resolve the release id for $TAG" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Release $TAG has id $release_id"

  release:
    needs: [prepare, create-release]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Universal: Apple Silicon + Intel
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    # macOS cold universal build measured at ~14 min; 45 bounds a hang well
    # under GitHub's 6h default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS build compiles BOTH Apple targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's Ubuntu runners point apt at azure.archive.ubuntu.com,
          # which has twice been unreachable for hours and left this step
          # hanging until the job timeout. Bound every attempt, then fall back
          # to the public archive instead of waiting on a dead mirror.
          apt_options=(
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::Retries=1
          )
          packages=(libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf)

          # The `&&` is deliberate: inside an `if`, bash suspends `set -e` for
          # the whole function, so an unchecked update would let install run
          # against a stale package list.
          install_dependencies() {
            sudo apt-get update "${apt_options[@]}" &&
              sudo apt-get install -y "${apt_options[@]}" "${packages[@]}"
          }

          if install_dependencies; then
            exit 0
          fi

          echo "::warning::apt could not reach azure.archive.ubuntu.com; retrying against archive.ubuntu.com"
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i \
              -e 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              -e 's|azure\.ports\.ubuntu\.com|ports.ubuntu.com|g' {} +

          install_dependencies

      - name: Sync version from resolved release
        # bash on ALL OSes: pwsh (the windows-latest default) cannot run
        # `${GITHUB_REF_NAME#v}` and has no /tmp — this exact mismatch
        # killed the v0.1.1 release job.
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json && mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          # Keep the Rust packages in sync too (drift caused v0.1.0 locals vs v0.1.2 tags).
          sed -i.bak -E 's/^version = ".*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml crates/clippings-parser/Cargo.toml && rm -f src-tauri/Cargo.toml.bak crates/clippings-parser/Cargo.toml.bak

      - run: npm ci

      # The Tauri generate_context! macro validates frontendDist at COMPILE time,
      # so dist/ must exist before ANY cargo build/test — including this one.
      - run: npm run build

      - run: npm run check

      - run: npm run test

      # tauri-action reads target/release on Linux and Windows, so the release
      # test compile there is reused by the build below. The macOS leg builds a
      # universal binary into target/<triple>/release, which never reads
      # target/release, so release mode there is a duplicate compile.
      - name: Test Rust workspace
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cargo test --workspace
          else
            cargo test --release --workspace
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signed auto-update: every bundle gets a minisign signature the
          # installed app verifies against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The release already exists: upload to it by id instead of letting
          # each leg look it up (and create one) by tag.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is left to the action (includeUpdaterJson defaults to
          # true). It merges each leg's platform entry into the existing file
          # and knows the v2 artifact names, which a hand-written manifest got
          # wrong twice: it looked for the v1Compatible `.AppImage.tar.gz` and
          # dropped the deb/rpm/nsis entries. The job below only verifies what
          # it published.
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: [prepare, create-release, release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Add the notes and check what tauri-action published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p manifest sigs
          # The action assembles latest.json as each leg finishes. Read it back
          # instead of trusting the upload: a leg whose update was lost, or an
          # entry left from a previous attempt, makes the app refuse the update
          # for that platform without a word.
          gh release download "$TAG" --pattern 'latest.json' --dir manifest
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          gh release view "$TAG" --json assets > manifest/assets.json

          # The action only knows the release id, so it writes no notes and the
          # update dialog would show nothing. The body is the CHANGELOG section
          # the release was created with, which is exactly what "what's new"
          # should show.
          gh release view "$TAG" --json body -q .body > notes.md
          jq --rawfile notes notes.md '.notes = $notes' manifest/latest.json > latest.json

          bash .github/scripts/check-updater-manifest.sh \
            latest.json manifest/assets.json sigs "$VERSION"

      - name: Publish the finalized manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --clobber
