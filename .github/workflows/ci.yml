name: CI

# Pre-merge gate plus post-merge truth.
#
# A pull_request run validates a synthetic merge preview (refs/pull/N/merge), a
# commit that never lands on main. The push:main run validates the commit main
# actually receives — the same commit a release tags and ships.
#
# A Rust cache pays off here: clippy and cargo test compile the same deps, and
# branch scoping lets a PR restore what only main saves. release.yml stays out:
# no tag run can reuse another tag's cache, and its profile differs anyway.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# Superseded pushes to the same PR cancel their predecessor. main never cancels:
# its green check is the signal a release depends on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # A hung run would otherwise hold a runner for GitHub's 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ['macos-latest', 'ubuntu-22.04', 'windows-latest']
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # release.yml parses CHANGELOG.md with this script; pin it on one leg.
      - name: Test release notes script
        if: matrix.platform == 'ubuntu-22.04'
        run: bash .github/scripts/release-notes.test.sh

      # release.yml checks latest.json with this script; same rule.
      - name: Test updater manifest script
        if: matrix.platform == 'ubuntu-22.04'
        run: bash .github/scripts/check-updater-manifest.test.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's Ubuntu runners point apt at azure.archive.ubuntu.com,
          # which has twice been unreachable for hours and left this step
          # hanging until the job timeout. Bound every attempt, then fall back
          # to the public archive instead of waiting on a dead mirror.
          apt_options=(
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::Retries=1
          )
          packages=(libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf)

          # The `&&` is deliberate: inside an `if`, bash suspends `set -e` for
          # the whole function, so an unchecked update would let install run
          # against a stale package list.
          install_dependencies() {
            sudo apt-get update "${apt_options[@]}" &&
              sudo apt-get install -y "${apt_options[@]}" "${packages[@]}"
          }

          if install_dependencies; then
            exit 0
          fi

          echo "::warning::apt could not reach azure.archive.ubuntu.com; retrying against archive.ubuntu.com"
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i \
              -e 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              -e 's|azure\.ports\.ubuntu\.com|ports.ubuntu.com|g' {} +

          install_dependencies

      - run: npm ci

      # The Tauri generate_context! macro validates frontendDist at COMPILE time,
      # so dist/ must exist before ANY cargo build/test.
      - run: npm run build

      - run: npm run check

      - run: npm run lint

      - run: npm run comments

      - run: npm run test

      # The Rust side gets the same treatment as the TS side: formatting and
      # lints are gates, not suggestions. clippy runs over every target so the
      # inline command tests are linted too.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

