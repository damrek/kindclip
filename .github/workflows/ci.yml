name: CI

# Pre-merge gate plus post-merge truth.
#
# A pull_request run validates a synthetic merge preview (refs/pull/N/merge), a
# commit that never lands on main. The push:main run validates the commit main
# actually receives — the same commit a release tags and ships.
#
# Deliberately NO Rust cache: CI builds debug while release.yml builds release,
# so even a warmed default-branch cache could not feed the release build, and
# 2-3 minute legs do not pay for the storage churn it would add.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pushes to the same PR cancel their predecessor. main never cancels:
# its green check is the signal a release depends on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # A hung run would otherwise hold a runner for GitHub's 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ['macos-latest', 'ubuntu-22.04', 'windows-latest']
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # The Tauri generate_context! macro validates frontendDist at COMPILE time,
      # so dist/ must exist before ANY cargo build/test.
      - run: npm run build

      - run: npm run check

      - run: npm run lint

      - run: npm run test

      # The Rust side gets the same treatment as the TS side: formatting and
      # lints are gates, not suggestions. clippy runs over every target so the
      # inline command tests are linted too.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

