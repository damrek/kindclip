name: CI

# Pre-merge gate. A broken commit used to surface only once it was tagged,
# burning a full release run (see v0.1.0 and v0.1.1). This runs the same checks
# on the pull request instead, so main only ever receives validated commits.
#
# Deliberately NO Rust cache here: a tag-triggered release cannot read another
# tag's cache, and there is no default-branch warm step to feed it, so a cache
# in this file would only speed up repeat pushes to a single PR — a cost that
# does not pay for the storage churn it adds. The release gets its speed from
# compiling the workspace once, in release mode, not from caching.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: ['macos-latest', 'ubuntu-22.04', 'windows-latest']
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # The Tauri generate_context! macro validates frontendDist at COMPILE time,
      # so dist/ must exist before ANY cargo build/test.
      - run: npm run build

      - run: npm run check

      - run: npm run test

      - run: cargo test --workspace
