[package]
name = "kindclip"
version = "1.20.0"
description = "Kindle clippings viewer"
authors = []
edition = "2021"

[lib]
name = "kindclip_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-opener = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clippings-parser = { path = "../crates/clippings-parser" }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
